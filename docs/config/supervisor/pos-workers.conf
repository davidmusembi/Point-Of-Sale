; =============================================================================
; ultimatePOS — Supervisor Configuration
; =============================================================================
; Place at: /etc/supervisor/conf.d/pos-workers.conf
; Apply:    supervisorctl reread && supervisorctl update
; =============================================================================

; ---------------------------------------------------------------------------
; Default queue worker — handles mail, notifications, general jobs
; ---------------------------------------------------------------------------
[program:pos-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pos/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pos-worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

; ---------------------------------------------------------------------------
; Tenant provisioning queue — isolated so a slow DB creation never
; blocks emails or other jobs. stancl's CreateDatabase + MigrateDatabase
; jobs are dispatched on this queue when shouldBeQueued is set to true.
; ---------------------------------------------------------------------------
[program:pos-worker-tenants]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pos/artisan queue:work redis --queue=tenants --sleep=3 --tries=2 --max-time=7200 --timeout=600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pos-worker-tenants.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; Long timeout — creating a new DB and running all tenant migrations can take time
stopwaitsecs=600

; ---------------------------------------------------------------------------
; Laravel Scheduler — replaces a system cron entry (optional approach)
; If you prefer a cron entry instead, see deployment.md
; ---------------------------------------------------------------------------
[program:pos-scheduler]
process_name=%(program_name)s
command=php /var/www/pos/artisan schedule:work
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pos-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
