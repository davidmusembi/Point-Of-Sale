# =============================================================================
# Cloudflare Origin Lock — allow only Cloudflare IP ranges
# =============================================================================
# When Cloudflare is proxying your domain (orange cloud enabled), lock your
# origin so it only accepts connections from Cloudflare's IP ranges.
# This eliminates host-header injection from the public internet entirely.
#
# Usage: include this snippet inside each server{} block that should be
#        Cloudflare-only, or in a shared conf file.
#
#   include /etc/nginx/snippets/cloudflare-ips.conf;
#
# Keep this file up to date with the update-cloudflare-ips.sh cron script.
# Last updated: 2026-05-12
# Source:       https://www.cloudflare.com/ips/
# =============================================================================

# IPv4
allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;

# IPv6
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

# Block everything else
deny all;
