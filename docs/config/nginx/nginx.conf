# =============================================================================
# ultimatePOS — Production Nginx Configuration
# =============================================================================
# Replace every instance of "yourdomain.com" with your actual domain.
# Place this file at: /etc/nginx/sites-available/pos
# Symlink: ln -s /etc/nginx/sites-available/pos /etc/nginx/sites-enabled/pos
# Reload: nginx -t && systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones (define in /etc/nginx/nginx.conf http{} block,
# or include this file from inside the http{} block)
# ---------------------------------------------------------------------------
limit_req_zone $host zone=tenant_probe:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=global_ip:10m rate=60r/m;

# ---------------------------------------------------------------------------
# 1. HTTP → HTTPS redirect (all hosts)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # ACME challenge for Certbot renewal (needed even on the redirect block)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. HTTPS default catch-all — silently drops unrecognized hosts
#    Must appear before the named server blocks so it is selected last.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Close the TCP connection without sending any response.
    # Prevents host-header probing and wastes zero PHP-FPM workers.
    return 444;
}

# ---------------------------------------------------------------------------
# 3. Central app — explicit hostname(s) only
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/pos/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/pos-central-access.log;
    error_log  /var/log/nginx/pos-central-error.log;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass            unix:/run/php/php8.1-fpm.sock;
        fastcgi_index           index.php;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout    300;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # Block hidden files and sensitive paths
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sh|sql|bak)$ { deny all; }

    # Static asset caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ---------------------------------------------------------------------------
# 4. Tenant subdomains — wildcard, strict subdomain regex
#    Regex only matches lowercase alphanumeric + hyphens (1–63 chars),
#    rejecting malformed or garbage subdomains before PHP sees them.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Accepts:   mybiz.yourdomain.com
    # Rejects:   _.yourdomain.com  ../yourdomain.com  etc.
    server_name ~^(?<subdomain>[a-z0-9][a-z0-9\-]{0,61}[a-z0-9])\.yourdomain\.com$;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/pos/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/pos-tenant-access.log;
    error_log  /var/log/nginx/pos-tenant-error.log;

    client_max_body_size 50M;

    # Rate limit subdomain probing (30 req/min per unique host)
    limit_req zone=tenant_probe burst=20 nodelay;
    limit_req zone=global_ip   burst=60 nodelay;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass            unix:/run/php/php8.1-fpm.sock;
        fastcgi_index           index.php;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout    300;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sh|sql|bak)$ { deny all; }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
