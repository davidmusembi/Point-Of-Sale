# =============================================================================
# ultimatePOS — Production Nginx Configuration (Cloudflare-locked variant)
# =============================================================================
# Use this file when Cloudflare is acting as your reverse proxy (orange cloud).
# Differences from nginx.conf:
#   - Each server block includes the Cloudflare IP allowlist snippet.
#   - real_ip_header is set so Laravel sees the real visitor IP, not CF's IP.
#   - No TLS cert needed on origin (Cloudflare terminates TLS).
#     If you want end-to-end encryption, set Cloudflare SSL mode to "Full (strict)"
#     and keep your Let's Encrypt certs in place.
# =============================================================================

limit_req_zone $http_cf_connecting_ip zone=tenant_probe:10m rate=30r/m;
limit_req_zone $http_cf_connecting_ip zone=global_ip:10m    rate=60r/m;

# ---------------------------------------------------------------------------
# Restore real visitor IP from Cloudflare's CF-Connecting-IP header
# ---------------------------------------------------------------------------
real_ip_header    CF-Connecting-IP;
# Also trust X-Forwarded-For from the CF IP ranges:
set_real_ip_from  173.245.48.0/20;
set_real_ip_from  103.21.244.0/22;
set_real_ip_from  103.22.200.0/22;
set_real_ip_from  103.31.4.0/22;
set_real_ip_from  141.101.64.0/18;
set_real_ip_from  108.162.192.0/18;
set_real_ip_from  190.93.240.0/20;
set_real_ip_from  188.114.96.0/20;
set_real_ip_from  197.234.240.0/22;
set_real_ip_from  198.41.128.0/17;
set_real_ip_from  162.158.0.0/15;
set_real_ip_from  104.16.0.0/13;
set_real_ip_from  104.24.0.0/14;
set_real_ip_from  172.64.0.0/13;
set_real_ip_from  131.0.72.0/22;
set_real_ip_from  2400:cb00::/32;
set_real_ip_from  2606:4700::/32;
set_real_ip_from  2803:f800::/32;
set_real_ip_from  2405:b500::/32;
set_real_ip_from  2405:8100::/32;
set_real_ip_from  2a06:98c0::/29;
set_real_ip_from  2c0f:f248::/32;

# ---------------------------------------------------------------------------
# 1. HTTP default catch-all — drop non-Cloudflare connections
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    return 444;
}

# ---------------------------------------------------------------------------
# 2. Central app
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name yourdomain.com www.yourdomain.com;

    # Only Cloudflare IPs may reach this origin
    include /etc/nginx/snippets/cloudflare-ips.conf;

    root  /var/www/pos/public;
    index index.php;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;

    access_log /var/log/nginx/pos-central-access.log;
    error_log  /var/log/nginx/pos-central-error.log;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass         unix:/run/php/php8.1-fpm.sock;
        fastcgi_index        index.php;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sh|sql|bak)$ { deny all; }
}

# ---------------------------------------------------------------------------
# 3. Tenant subdomains
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name ~^(?<subdomain>[a-z0-9][a-z0-9\-]{0,61}[a-z0-9])\.yourdomain\.com$;

    # Only Cloudflare IPs may reach this origin
    include /etc/nginx/snippets/cloudflare-ips.conf;

    root  /var/www/pos/public;
    index index.php;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;

    access_log /var/log/nginx/pos-tenant-access.log;
    error_log  /var/log/nginx/pos-tenant-error.log;

    client_max_body_size 50M;

    limit_req zone=tenant_probe burst=20 nodelay;
    limit_req zone=global_ip   burst=60 nodelay;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass         unix:/run/php/php8.1-fpm.sock;
        fastcgi_index        index.php;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sh|sql|bak)$ { deny all; }
}
