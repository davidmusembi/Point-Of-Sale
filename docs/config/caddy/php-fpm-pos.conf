; =============================================================================
; PHP-FPM pool for ultimatePOS
; Place at: /etc/php/8.1/fpm/pool.d/pos.conf
;
; Option A (test server): user = developer
; Option B (production):  user = www-data
; =============================================================================

[pos]
; --- Change to www-data:www-data for production ---
user  = developer
group = developer

; Socket — Caddy references this in php_fastcgi directive
listen = /run/php/php8.1-fpm-pos.sock
listen.owner = developer
listen.group = developer
listen.mode  = 0660

; Process management
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; Timeouts
request_terminate_timeout = 300s

; Error logging
php_admin_value[error_log]      = /var/log/php-fpm/pos-error.log
php_admin_flag[log_errors]      = On
php_admin_value[display_errors] = Off

; Limits
php_admin_value[memory_limit]       = 256M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size]       = 50M
php_admin_value[max_execution_time]  = 300

; Sessions via Redis (matches Laravel SESSION_DRIVER=redis)
; php_admin_value[session.save_handler] = redis
; php_admin_value[session.save_path]    = "tcp://127.0.0.1:6379"
